[project]
name = "wazi"
version = "0.1.0"
description = "Wazi: a learning-focused WhatsApp AI agent. Phase 4: secure, credential-free webhook foundation."
readme = "docs/PHASE_4_FOUNDATION.md"
requires-python = ">=3.12"
# Runtime dependency: the web framework only. Everything else is the standard library.
dependencies = [
    "fastapi>=0.115,<1",
]

[project.optional-dependencies]
# Only needed to run the webhook locally with a real HTTP server (not needed for tests).
serve = [
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",  # required by FastAPI's TestClient
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wazi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
